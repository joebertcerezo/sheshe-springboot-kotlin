<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Password Reset OTP</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 20px;
    }
    .container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffffff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h2 {
        color: #333333;
    }
    .otp {
        font-size: 24px;
        font-weight: bold;
        color: #007bff;
        margin: 20px 0;
    }
    p {
        color: #555555;
        line-height: 1.6;
    }
    .footer {
        margin-top: 20px;
        font-size: 12px;
        color: #888888;
    }
  </style>
</head>
<body>
<div class="container">
  <h2>Password Reset Request</h2>
  <p>Dear User,</p>
  <p>Your One-Time Password (OTP) for resetting your password is:</p>
  <div class="otp" th:text="${otp}"></div>
  <p>This OTP is valid for <span th:text="${expiryMinutes}"></span> minutes.</p>
  <p>If you did not request this, please ignore this email or contact support.</p>
  <div class="footer">
    <p>&copy; 2025 Your Company. All rights reserved.</p>
  </div>
</div>
</body>
</html>
